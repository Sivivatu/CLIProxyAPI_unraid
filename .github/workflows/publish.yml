name: Sync upstream and publish GHCR
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-cliproxyapi
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Sivivatu/CLIProxyAPI_unraid' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.sync.outputs.version }}
      publish: ${{ steps.pending.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: docker/setup-buildx-action@v4
      - name: Resolve stable upstream release and pin its image
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-upstream.py --output "$GITHUB_OUTPUT"
      - name: Record the upstream pin
        id: source
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          if [ "$CHANGED" = true ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Dockerfile upstream-release.json
            git commit -m "chore(upstream): pin CLIProxyAPI ${VERSION}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retry incomplete releases and reconcile latest
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sync.outputs.version }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          publish=true
          image=ghcr.io/sivivatu/cliproxyapi-unraid
          if [ "$CHANGED" = false ] && gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            version_digest=$(docker buildx imagetools inspect "$image:${VERSION#v}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            latest_digest=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            if [ -n "$version_digest" ] && [ "$version_digest" = "$latest_digest" ]; then
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Upstream $VERSION; publication required: $publish" >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  publish:
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate stable release tags
        id: tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python3 - <<'PY'
          import os
          version = os.environ['VERSION'].removeprefix('v')
          major, minor, patch = version.split('.')
          tags = [version, major + '.' + minor, major, 'sha-' + os.environ['SOURCE_SHA'][:7], 'latest']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tags<<TAGS\n')
              output.write('\n'.join('ghcr.io/sivivatu/cliproxyapi-unraid:' + tag for tag in tags))
              output.write('\nTAGS\n')
          PY
      - name: Confirm the tested source is still main
        env:
          TESTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$TESTED_SHA"
      - name: Publish all tags from the same multiarch build
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          provenance: true
          sbom: true
      - name: Create the production GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          upstream = json.loads(Path('upstream-release.json').read_text())
          Path('/tmp/release-notes.md').write_text(
              'Bundles CLIProxyAPI ' + upstream['version'] + '.\n\n'
              'Upstream release: ' + upstream['release_url'] + '\n\n'
              'Pinned upstream image digest: `' + upstream['digest'] + '`.\n\n'
              'Wrapper image: `ghcr.io/sivivatu/cliproxyapi-unraid@' + os.environ['IMAGE_DIGEST'] + '`.\n\n'
              'Version, major/minor, SHA and latest image tags were published together after '
              'native amd64 and arm64 build and fresh/legacy smoke tests. '
              'Live provider OAuth and inference require deployment verification.\n')
          PY
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "CLIProxyAPI Unraid $VERSION" --notes-file /tmp/release-notes.md --latest
          else
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --latest
          fi
          echo "Published $VERSION at $IMAGE_DIGEST (including latest)." >> "$GITHUB_STEP_SUMMARY"
